<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ</title>
<style>
@font-face{font-family:'Prompt';src:url('fonts/Prompt-Light.woff2') format('woff2');font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:'Prompt';src:url('fonts/Prompt-Light.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Prompt';src:url('fonts/Prompt-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Prompt';src:url('fonts/Prompt-Medium.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Prompt';src:url('fonts/Prompt-Medium.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Prompt';src:url('fonts/Prompt-Medium.woff2') format('woff2');font-weight:500 700;font-style:normal;font-display:swap}

:root{
  --blue:#4143F6;
  --lime:#DDF344;
  --cream:#FFF9EB;
  --sky:#1FA6FE;
  --ink:#171A2B;
  --line:rgba(23,26,43,.13);
  --white:#FFFFFF;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:'Prompt' !important;color:var(--ink);font-synthesis:none}
button,input,textarea,select{font-family:'Prompt' !important}
body{
  min-height:100vh;
  background:var(--cream);
  display:grid;
  place-items:center;
  padding:24px;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.auth-wrap{width:100%;max-width:440px}
.card{
  position:relative;
  overflow:hidden;
  background:var(--blue);
  color:var(--cream);
  border-radius:28px;
  padding:34px;
  box-shadow:0 18px 50px rgba(65,67,246,.20);
}
.card::before{
  content:'';
  position:absolute;
  width:190px;height:190px;
  border-radius:50%;
  background:rgba(31,166,254,.14);
  top:-105px;right:-68px;
  pointer-events:none;
}
.card::after{
  content:'';
  position:absolute;
  width:120px;height:120px;
  border-radius:50%;
  background:rgba(221,243,68,.10);
  bottom:-75px;left:-50px;
  pointer-events:none;
}
.topbar{
  position:relative;
  z-index:1;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  margin-bottom:26px;
}
.home-link{
  color:var(--cream);
  text-decoration:none;
  font-size:13px;
  font-weight:400;
  padding:6px 0;
  opacity:.84;
}
.home-link:hover{color:var(--lime);opacity:1}
h1{
  position:relative;
  z-index:1;
  font-size:30px;
  line-height:1.25;
  margin-bottom:7px;
  letter-spacing:-.5px;
  font-weight:500;
}
.subtitle{
  position:relative;
  z-index:1;
  font-size:13px;
  color:rgba(255,249,235,.78);
  line-height:1.7;
  margin-bottom:22px;
  font-weight:300;
}
.tabs{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:1fr 1fr;
  padding:4px;
  background:rgba(255,249,235,.10);
  border:1px solid rgba(255,249,235,.17);
  border-radius:14px;
  margin-bottom:22px;
  gap:4px;
}
.tab{
  border:0;
  background:transparent;
  border-radius:10px;
  padding:11px 8px;
  font-family:'Prompt' !important;
  font-size:14px;
  font-weight:500;
  color:rgba(255,249,235,.76);
  cursor:pointer;
  appearance:none;
  -webkit-appearance:none;
  touch-action:manipulation;
  transition:background .15s ease,color .15s ease,transform .15s ease;
}
.tab.active{background:var(--lime);color:var(--ink)}
.tab:active{transform:scale(.985)}
.form{display:none;position:relative;z-index:1}
.form.active{display:block}
.field{margin-bottom:15px}
label{
  display:block;
  font-size:13px;
  font-weight:400;
  margin-bottom:7px;
  color:var(--cream);
}
input{
  width:100%;
  height:48px;
  border:1px solid rgba(23,26,43,.10);
  border-radius:12px;
  padding:0 14px;
  font-family:'Prompt' !important;
  font-size:14px;
  font-weight:400;
  color:var(--ink);
  background:var(--cream);
  outline:none;
  transition:border-color .15s ease,box-shadow .15s ease;
}
input::placeholder{color:#8B8D98}
input:focus{border-color:var(--lime);box-shadow:0 0 0 3px rgba(221,243,68,.17)}
.forgot{display:flex;justify-content:flex-end;margin-top:-5px;margin-bottom:18px}
.forgot button,.switch-text button{
  border:0;
  background:none;
  color:var(--lime);
  font-family:'Prompt' !important;
  font-size:13px;
  font-weight:400;
  cursor:pointer;
  padding:2px;
  touch-action:manipulation;
}
.primary{
  width:100%;
  height:49px;
  border:0;
  border-radius:13px;
  background:var(--lime);
  color:var(--ink);
  font-family:'Prompt' !important;
  font-size:15px;
  font-weight:500;
  cursor:pointer;
  touch-action:manipulation;
  transition:transform .12s ease,opacity .12s ease;
}
.primary:hover{opacity:.94}
.primary:active{transform:scale(.99)}
.primary:disabled{opacity:.55;cursor:not-allowed}
.status{
  min-height:22px;
  margin-top:15px;
  border-radius:10px;
  padding:0 11px;
  font-size:13px;
  line-height:1.5;
  font-weight:400;
}
.status:not(:empty){padding-top:9px;padding-bottom:9px}
.status.error{color:#8A1F17;background:#FFE7E4}
.status.success{color:#205E2B;background:#E9F7EA}
.switch-text{
  text-align:center;
  color:rgba(255,249,235,.72);
  font-size:13px;
  margin-top:18px;
  font-weight:300;
}
@media (max-width:520px){
  body{padding:14px;place-items:start center;padding-top:22px}
  .card{padding:24px;border-radius:22px}
  h1{font-size:27px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<link rel="preload" href="fonts/Prompt-Light.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Prompt-Medium.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
<main class="auth-wrap">
  <section class="card" aria-label="การเข้าสู่ระบบ">
    <div class="topbar">
      <a class="home-link" href="index.html">กลับหน้าหลัก</a>
    </div>

    <h1 id="title">เข้าสู่ระบบ</h1>
    <p class="subtitle" id="subtitle">เข้าสู่ระบบเพื่อจองช่างภาพและจัดการงานของคุณ</p>

    <div class="tabs" role="tablist" aria-label="การยืนยันตัวตน">
      <button class="tab active" id="loginTab" type="button" role="tab" aria-selected="true">เข้าสู่ระบบ</button>
      <button class="tab" id="signupTab" type="button" role="tab" aria-selected="false">สมัครสมาชิก</button>
    </div>

    <form class="form active" id="loginForm">
      <div class="field">
        <label for="loginEmail">อีเมล</label>
        <input id="loginEmail" type="email" autocomplete="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="loginPassword">รหัสผ่าน</label>
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="อย่างน้อย 6 ตัวอักษร" required>
      </div>
      <div class="forgot"><button id="forgotBtn" type="button">ลืมรหัสผ่าน?</button></div>
      <button class="primary" id="loginBtn" type="submit">เข้าสู่ระบบ</button>
      <div class="status" id="loginStatus" aria-live="polite"></div>
      <div class="switch-text">ยังไม่มีบัญชี? <button id="toSignup" type="button">สมัครสมาชิก</button></div>
    </form>

    <form class="form" id="signupForm">
      <div class="field">
        <label for="signupEmail">อีเมล</label>
        <input id="signupEmail" type="email" autocomplete="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="signupPassword">รหัสผ่าน</label>
        <input id="signupPassword" type="password" autocomplete="new-password" minlength="6" placeholder="อย่างน้อย 6 ตัวอักษร" required>
      </div>
      <div class="field">
        <label for="signupConfirm">ยืนยันรหัสผ่าน</label>
        <input id="signupConfirm" type="password" autocomplete="new-password" minlength="6" placeholder="พิมพ์รหัสผ่านอีกครั้ง" required>
      </div>
      <button class="primary" id="signupBtn" type="submit">สร้างบัญชี</button>
      <div class="status" id="signupStatus" aria-live="polite"></div>
      <div class="switch-text">มีบัญชีแล้ว? <button id="toLogin" type="button">เข้าสู่ระบบ</button></div>
    </form>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://kleutavfwtbefeoowgnu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_mYLsuV1GNZGh9_ieNfIc-g_dfmSVjKL';
const AUTH_URL = window.location.origin + window.location.pathname;
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (id) => document.getElementById(id);
const loginTab = $('loginTab');
const signupTab = $('signupTab');
const loginForm = $('loginForm');
const signupForm = $('signupForm');

function clearStatuses(){
  $('loginStatus').textContent = '';
  $('signupStatus').textContent = '';
  $('loginStatus').className = 'status';
  $('signupStatus').className = 'status';
}
function setMode(mode){
  const signup = mode === 'signup';
  loginTab.classList.toggle('active', !signup);
  signupTab.classList.toggle('active', signup);
  loginTab.setAttribute('aria-selected', String(!signup));
  signupTab.setAttribute('aria-selected', String(signup));
  loginForm.classList.toggle('active', !signup);
  signupForm.classList.toggle('active', signup);
  $('title').textContent = signup ? 'สมัครสมาชิก' : 'เข้าสู่ระบบ';
  $('subtitle').textContent = signup
    ? 'สร้างบัญชีเพื่อจองช่างภาพและติดตามงานของคุณ'
    : 'เข้าสู่ระบบเพื่อจองช่างภาพและจัดการงานของคุณ';
  clearStatuses();
}
function showStatus(id, message, type){
  const el = $(id);
  el.textContent = message;
  el.className = 'status ' + type;
}
function setBusy(id, busy, normalText){
  const btn = $(id);
  btn.disabled = busy;
  btn.textContent = busy ? 'กำลังดำเนินการ…' : normalText;
}

loginTab.addEventListener('click', () => setMode('login'));
signupTab.addEventListener('click', () => setMode('signup'));
$('toSignup').addEventListener('click', () => setMode('signup'));
$('toLogin').addEventListener('click', () => setMode('login'));

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearStatuses();
  setBusy('loginBtn', true, 'เข้าสู่ระบบ');
  try {
    const email = $('loginEmail').value.trim();
    const password = $('loginPassword').value;
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) throw error;
    window.location.href = 'index.html';
  } catch (err) {
    showStatus('loginStatus', err.message || 'เข้าสู่ระบบไม่สำเร็จ', 'error');
    setBusy('loginBtn', false, 'เข้าสู่ระบบ');
  }
});

signupForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearStatuses();
  const email = $('signupEmail').value.trim();
  const password = $('signupPassword').value;
  const confirm = $('signupConfirm').value;

  if (password !== confirm) {
    showStatus('signupStatus', 'รหัสผ่านทั้งสองช่องไม่ตรงกัน', 'error');
    return;
  }
  if (password.length < 6) {
    showStatus('signupStatus', 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร', 'error');
    return;
  }

  setBusy('signupBtn', true, 'สร้างบัญชี');
  try {
    const { data, error } = await supabaseClient.auth.signUp({
      email,
      password,
      options: { emailRedirectTo: AUTH_URL }
    });
    if (error) throw error;

    if (data.session) {
      showStatus('signupStatus', 'สมัครสมาชิกสำเร็จ กำลังเข้าสู่ระบบ…', 'success');
      setTimeout(() => window.location.href = 'index.html', 500);
    } else {
      showStatus('signupStatus', 'สมัครสมาชิกสำเร็จ กรุณาเช็กอีเมลเพื่อยืนยันบัญชี แล้วกลับมาเข้าสู่ระบบ', 'success');
      $('signupForm').reset();
    }
  } catch (err) {
    showStatus('signupStatus', err.message || 'สมัครสมาชิกไม่สำเร็จ', 'error');
  } finally {
    setBusy('signupBtn', false, 'สร้างบัญชี');
  }
});

$('forgotBtn').addEventListener('click', async () => {
  clearStatuses();
  const email = $('loginEmail').value.trim();
  if (!email) {
    showStatus('loginStatus', 'กรอกอีเมลก่อน แล้วกด “ลืมรหัสผ่าน?” อีกครั้ง', 'error');
    return;
  }
  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: AUTH_URL
  });
  if (error) {
    showStatus('loginStatus', error.message || 'ส่งลิงก์รีเซ็ตรหัสผ่านไม่สำเร็จ', 'error');
    return;
  }
  showStatus('loginStatus', 'ส่งลิงก์รีเซ็ตรหัสผ่านไปที่อีเมลแล้ว', 'success');
});
</script>
</body>
</html>
